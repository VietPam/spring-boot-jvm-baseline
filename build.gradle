plugins {
	id 'java'
	// Them checker loi space, code smell, bug pattern
	id 'checkstyle'
	id 'pmd'
	id 'com.github.spotbugs' version '6.5.10'
	// Them checker loi space, code smell, bug pattern
	id 'jacoco'
	id 'com.diffplug.spotless' version '8.9.0'
	// TODO: tich hop SonarQube/SonarCloud (id 'org.sonarqube' version '...') - can tao tai khoan SonarCloud + SONAR_TOKEN secret truoc
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.vietpq'
version = '0.0.1-SNAPSHOT'
description = 'Minimal Spring Boot hello-world app - JVM Docker baseline'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
// Them checker loi space, code smell, bug pattern

checkstyle {
	toolVersion = '13.0.0'
	configFile = file('config/checkstyle/checkstyle.xml')
	maxWarnings = 0
}

pmd {
	toolVersion = '7.26.0'
	ruleSetFiles = files('config/pmd/ruleset.xml')
	ruleSets = []
	ignoreFailures = false
}

spotbugs {
	effort = 'max'
	reportLevel = 'medium'
	ignoreFailures = false
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
	reports {
		html.required = true
		xml.required = false
	}
}
// Them checker loi space, code smell, bug pattern

jacoco {
	toolVersion = '0.8.14'
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
}

spotless {
	java {
		target 'src/**/*.java'
		removeUnusedImports()
		importOrder()
		trimTrailingWhitespace()
		indentWithSpaces(4)
		endWithNewline()
	}
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
		showStandardStreams = true
	}
	afterSuite { desc, result ->
		if (!desc.parent) {
			println "\nTest summary: ${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped"
		}
	}
}
